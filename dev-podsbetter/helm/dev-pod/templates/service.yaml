apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-pod.fullname" . }}
  labels:
    {{- include "dev-pod.labels" . | nindent 4 }}
spec:
  clusterIP: None            # headless: stable DNS name ws-<name>-0.ws-<name>.<ns>.svc
  selector:
    {{- include "dev-pod.selectorLabels" . | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.sshd.port }}
      targetPort: {{ .Values.sshd.port }}
