apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-python-devtools
  labels:
    app.kubernetes.io/name: python-devtools
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: python-devtools
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-devtools
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: python-devtools
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir {{ join " " .Values.devtools.packages }} &&
              sleep infinity
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: debugpy
              containerPort: {{ .Values.service.debugPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
