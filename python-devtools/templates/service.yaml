apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-python-devtools
  labels:
    app.kubernetes.io/name: python-devtools
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: python-devtools
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: debugpy
      port: {{ .Values.service.debugPort }}
      targetPort: debugpy
      protocol: TCP
