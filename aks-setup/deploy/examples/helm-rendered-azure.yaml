# Source: oauth2-proxy.yaml

# Sign-in in front of the portal. Any OIDC provider works (Okta, Entra ID, Keycloak, Google…).
# The e-mail claim must match how the API server names users (--oidc-username-claim=email).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: devspaces-system
  labels: { app.kubernetes.io/name: oauth2-proxy }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: oauth2-proxy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: oauth2-proxy }
    spec:
      serviceAccountName: devspaces-secrets   # e.g. workload identity for the Key Vault CSI driver
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=entra-id
            - --oidc-issuer-url=https://login.microsoftonline.com/TENANT-ID/v2.0
            - --email-domain=corp.example
            - --upstream=http://workspace-portal.devspaces-system.svc/
            - --http-address=0.0.0.0:4180
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-refresh=1h
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --pass-access-token=false
            - --skip-provider-button=true
            - --oidc-groups-claim=groups
            - "--oidc-groups-claim=groups"
            - "--scope=openid profile email"
            - "--cookie-secure=true"
            - "--cookie-samesite=lax"
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: cookie-secret } }
          ports:
            - { name: http, containerPort: 4180 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }   # mounting makes the CSI driver sync the Secret
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: "devspaces-keyvault" }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: devspaces-system
spec:
  selector: { app.kubernetes.io/name: oauth2-proxy }
  ports:
    - { name: http, port: 80, targetPort: http }

