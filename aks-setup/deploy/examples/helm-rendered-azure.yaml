# Source: rbac.yaml
# Generated-by-design from deploy/platform/* — keep both in sync (see charts/devspaces/README.md).
# Developers never get cluster-wide rights. `workspace admin onboard` binds the
# workspace-developer ClusterRole inside the developer's own namespace(s) only.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-developer
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]       # the SSH path (kubectl exec → socat → sshd)
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]   # --expose adds an ingress rule
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]                     # `workspace drives snapshot` / restore
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]                        # see who a workspace is shared with
    verbs: ["get", "list"]
---
# Everyone who can authenticate may read the catalog (languages, tools, profiles).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-catalog-reader
  namespace: devspaces-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["workspace-catalog", "workspace-features"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-catalog-reader
  namespace: devspaces-system
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-catalog-reader
---
# Developers need to know their own namespace exists; `workspace create` checks it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-namespace-viewer
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workspace-namespace-viewer
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workspace-namespace-viewer
---
# What `workspace admin onboard` needs if you delegate it to a platform team
# that is not cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-admin
rules:
  - apiGroups: [""]
    resources: ["namespaces", "resourcequotas", "limitranges", "serviceaccounts", "secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch", "delete", "bind", "escalate"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["endpoints", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
# Source: reaper.yaml
# Generated-by-design from deploy/platform/* — keep both in sync (see charts/devspaces/README.md).
# Idle reaper: every 10 minutes, scale to zero any workspace whose last SSH /
# editor activity (pod annotation devspaces.io/last-active, stamped by the
# workspace heartbeat) is older than its devspaces.io/idle-timeout. Volumes are
# untouched; the next `ssh` or `workspace start` scales it back up.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-reaper
  namespace: devspaces-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-reaper
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workspace-reaper
subjects:
  - kind: ServiceAccount
    name: workspace-reaper
    namespace: devspaces-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workspace-reaper
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: workspace-reaper
  namespace: devspaces-system
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 540
      template:
        spec:
          serviceAccountName: workspace-reaper
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              image: devspacesacr.azurecr.io/devspaces/workspace-cli:2026.11
              args: ["admin", "reap", "--all-namespaces", "--verbose"]
              env:
                - name: HOME
                  value: /tmp
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}

---
