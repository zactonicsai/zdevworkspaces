{{- if .Values.portal.enabled }}
# The portal impersonates the signed-in developer towards the API server; its own
# ServiceAccount can only `impersonate`. Identity comes from the auth proxy in front of it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-portal
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-portal-impersonator
rules:
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
  - nonResourceURLs: ["/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workspace-portal-impersonator
subjects:
  - kind: ServiceAccount
    name: workspace-portal
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workspace-portal-impersonator
{{- if .Values.portal.sharing }}
---
# Sharing is the one thing the portal does with its *own* identity instead of the developer's:
# a developer cannot read a teammate's profile key or write into the teammate's namespace, and
# that is exactly what "share this workspace / drive with bob" needs. The portal checks that the
# caller owns the resource, then uses this narrowly scoped role. Everything it may create is
# name-prefixed (share-*, workspace-guest-*, peer-*, shared-*) so it can never touch anything else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-portal-sharing
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["workspace-profile"]          # the guest's public keys
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]                        # ws-<name>-ssh of the OWNER (authorized_keys); the
    verbs: ["get", "patch"]                       # owner check happens first, via impersonation
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]   # share-* / workspace-guest-* only (admission policy below)
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete"]    # peer-* for links the owner accepts on behalf of a guest
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "create", "delete"]    # shared-* static PVs pointing at an RWX volume
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]    # shared-<owner>-<name> in the guest namespace
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]                        # project membership, guest namespace lookup
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workspace-portal-sharing
subjects:
  - kind: ServiceAccount
    name: workspace-portal
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workspace-portal-sharing
{{- end }}
{{- if and (not .Values.portal.existingSecret) .Values.portal.artifactoryToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: workspace-portal-artifactory
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  token: {{ .Values.portal.artifactoryToken | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-portal
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: workspace-portal }
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: workspace-portal }
  template:
    metadata:
      labels: { app.kubernetes.io/name: workspace-portal }
      annotations:
        checksum/catalog: {{ .Values.catalogOverrides | toJson | sha256sum }}
    spec:
      serviceAccountName: workspace-portal
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: portal
          image: {{ .Values.portal.image | default (printf "%s/workspace-portal:%s" .Values.global.registry .Values.global.tag) }}
          args:
            - -addr=:8080
            - -user-header={{ .Values.portal.userHeader }}
            - -groups-header={{ .Values.portal.groupsHeader }}
            - -trusted-proxies={{ .Values.portal.trustedProxies }}
            {{- if .Values.portal.labGroup }}
            - -lab-group={{ .Values.portal.labGroup }}
            {{- end }}
            {{- if .Values.portal.csp }}
            - -csp={{ .Values.portal.csp }}
            {{- end }}
            {{- if .Values.portal.oidc.issuer }}
            - -oidc-issuer={{ .Values.portal.oidc.issuer }}
            - -oidc-audience={{ .Values.portal.oidc.audience }}
            - -oidc-user-claim={{ .Values.portal.oidc.userClaim }}
            - -oidc-groups-claim={{ .Values.portal.oidc.groupsClaim }}
            {{- with .Values.portal.cliLogin }}
            {{- if .clientId }}
            - -cli-tenant={{ .tenant }}
            - -cli-client-id={{ .clientId }}
            {{- if .scope }}
            - -cli-scope={{ .scope }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if not .Values.portal.sharing }}
            - -sharing=false
            {{- end }}
          env:
            - name: ARTIFACTORY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.portal.existingSecret | default "workspace-portal-artifactory" }}
                  key: token
                  optional: true
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
{{ toYaml .Values.portal.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-portal
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app.kubernetes.io/name: workspace-portal }
  ports:
    - { name: http, port: 80, targetPort: http }
{{- if .Values.networkPolicy.enabled }}
---
# Nobody but the auth proxy may reach the portal pods (an identity header from any other
# source would be trusted otherwise).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-portal-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: workspace-portal }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: oauth2-proxy }
      ports:
        - { port: 8080, protocol: TCP }
{{- end }}
{{- end }}
