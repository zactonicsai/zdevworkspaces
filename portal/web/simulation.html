<title>Workspaces — Simulation</title>
<meta name="description" content="A single static page that simulates the developer workspaces portal: create workspaces, watch them boot, stop and start them, and type into a simulated shell. Everything is stored in your browser's localStorage; nothing is real.">
<!--
  simulation.html — ONE static file, no server, no network.
  * Tailwind CSS is compiled and inlined below (between the TW markers) so the page works
    from file://; rebuild after editing classes:  cd portal && npm run build:sim
  * State lives in localStorage under "ws.sim": workspaces, their virtual file systems,
    shell history, events, profile. "Reset demo" wipes it.
  * The lifecycle, the persistence rule (/home/dev survives, the rest is rebuilt), the idle
    reaper and the catalog mirror the real system in simplified form.
-->

<style>
  :root{--bg:#fff;--surface:#f4f4f4;--surface2:#e0e0e0;--text:#161616;--muted:#525252;--border:#e0e0e0;--link:#0f62fe;--ok:#198038;--warn:#8e6a00;--danger:#da1e28;--term:#161616}
  html.dark{--bg:#000;--surface:#161616;--surface2:#262626;--text:#f4f4f4;--muted:#c6c6c6;--border:#393939;--link:#78a9ff;--ok:#42be65;--warn:#f1c21b;--danger:#fa4d56;--term:#0b0b0b}
  body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--link)}
  .card{background:var(--surface);border:1px solid var(--border)}
  .btn{display:inline-flex;align-items:center;gap:.4rem;min-height:2.5rem;padding:0 .9rem;font-weight:500;border:1px solid transparent;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-p{background:#0f62fe;color:#fff}.btn-p:hover:not(:disabled){background:#0353e9}html.dark .btn-p{background:#4589ff;color:#000}
  .btn-s{background:var(--surface2);color:var(--text)}.btn-o{background:transparent;color:var(--text);border-color:#8d8d8d}.btn-d{background:#da1e28;color:#fff}.btn-g{background:transparent;color:var(--link)}
  .btn-sm{min-height:2rem;padding:0 .7rem;font-size:.85rem}
  .input,.select{width:100%;min-width:0;max-width:100%;background:var(--surface);color:var(--text);border:0;border-bottom:1px solid #8d8d8d;padding:.55rem .7rem;font:inherit}
  .input:focus,.select:focus{outline:2px solid var(--link);outline-offset:-2px}
  .check{display:flex;gap:.6rem;align-items:flex-start;padding:.7rem .8rem;background:var(--surface);border:1px solid transparent;cursor:pointer}
  .check.on{border-color:var(--link);box-shadow:inset 3px 0 0 var(--link)}.check input{margin-top:.25rem;accent-color:#0f62fe}
  .pill{display:inline-flex;align-items:center;gap:.35rem;padding:.1rem .6rem;font-size:.75rem;font-weight:500;border-radius:999px;background:var(--surface2)}
  .pill::before{content:"";width:.5rem;height:.5rem;border-radius:999px;background:currentColor}
  .st-Running{color:var(--ok);background:rgba(36,161,72,.12)}.st-Stopped{color:var(--muted)}.st-Starting,.st-Pending{color:var(--warn);background:rgba(241,194,27,.15)}.st-Deleting{color:var(--danger)}
  .tab{padding:.6rem .9rem;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap}.tab[aria-selected=true]{color:var(--text);border-color:var(--link);font-weight:600}
  .term{background:var(--term);color:#e0e0e0;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.45;padding:.75rem 1rem;height:22rem;flex:1;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .term .p{color:#42be65}.term .err{color:#fa4d56}.term .dim{color:#8d8d8d}.term .hl{color:#78a9ff}

  .log{background:var(--term);color:#c6c6c6;font-family:ui-monospace,Menlo,monospace;font-size:.78rem;padding:.6rem .8rem;max-height:14rem;overflow:auto;white-space:pre-wrap}
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.9em;background:var(--surface2);padding:.05em .3em}

           ripgrep:{cmd:"rg",ver:"ripgrep 14.1.1",src:"artifactory",desc:"fast text search"}, fd:{cmd:"fd",ver:"fd 10.2.0",src:"artifactory",desc:"friendly find"}, gh:{cmd:"gh",ver:"gh version 2.74.0",src:"artifactory",desc:"GitHub CLI"}, k9s:{cmd:"k9s",ver:"Version: v0.50.6",src:"artifactory",desc:"terminal UI for Kubernetes"}, mcast:{cmd:"mcast-check",ver:"mcast-check (python)",src:"image",desc:"multicast test kit"} },

function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.remove("hidden"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add("hidden"),2500); }

/* ============================================================ virtual machine: files, boot, shell */
function freshImageFS(){ return { "/etc/os-release":"PRETTY_NAME=\"Ubuntu 24.04.2 LTS\"\nVERSION_CODENAME=noble\n", "/etc/hostname":"", "/opt/workspace/entrypoint.sh":"#!/usr/bin/env bash\n# (the real one is 230 lines)\n", "/usr/local/bin/":null, "/tmp/":null, "/workspace":"-> /home/dev/workspace" }; }
function freshHomeFS(ws){ return { "/home/dev/":null, "/home/dev/workspace/":null, "/home/dev/.bashrc":"# persistent: survives stop/start\nexport PATH=$HOME/.local/bin:$PATH\n", "/home/dev/README-workspace.md":`# Your workspace\n\n* /workspace -> ~/workspace, where repos are cloned.\n* Everything under /home/dev lives on your volume and survives stop/start.\n* Anything else (sudo apt install, /opt, /tmp) is rebuilt from the image on every start.\n* ws-logs shows the boot log.\n`, "/home/dev/.bash_history":"" }; }
function bootSteps(ws){
  const L=[]; const t0=now(); let t=0; const add=(d,m)=>{t+=d;L.push([t,m])};
  add(0,`workspace '${ws.name}' starting: lang=${ws.languages[0]} profile=${ws.profile} tools=${ws.tools.join(",")||"none"}`);
  if(!ws.booted) add(300,"first boot: seeding /home/dev from /opt/workspace/skel");
  add(700,"sshd listening on 127.0.0.1:2222 (pid 42)");
  ws.languages.slice(1).forEach(l=>{add(600,`installing tool: ${l}`);add(1400,`tool ready: ${l}`)});
  ws.tools.forEach(tl=>{const a=CATALOG.tools[tl]&&CATALOG.tools[tl].src==="artifactory";add(400,`installing ${a?"artifact tool":"tool"}: ${tl}${a?"  (download: https://artifactory.example.com/artifactory/github-remote/…)":""}`);add(a?700:1200,`tool ready: ${tl}`)});
  if(ws.repo&&!ws.cloned){add(500,`cloning ${ws.repo} into /home/dev/workspace/${repoDir(ws.repo)}`);add(1500,"clone complete")}
  add(300,"ready"); return L;
}
const repoDir=u=>u.replace(/\.git$/,"").split(/[/:]/).pop()||"repo";
function startBoot(ws){
  ws.status="Pending"; ws.bootLog=[]; ws.pod=`ws-${ws.name}-0`; ws.node=ws.profile==="hardware"?"lab-node-1":"node-"+(1+ws.name.length%2); save(); render();
  setTimeout(()=>{ ws.status="Starting"; ws.startedAt=now(); ws.imageFS=freshImageFS(); ws.imageFS["/etc/hostname"]=ws.pod+"\n"; ws.aptInstalled=[]; save(); render();
    const steps=bootSteps(ws); const base=now();
    steps.forEach(([d,m])=>setTimeout(()=>{ ws.bootLog.push(`[workspace ${clock(now())}] ${m}`); if(m==="clone complete"){ws.cloned=true; const d2=`/home/dev/workspace/${repoDir(ws.repo)}/`; ws.homeFS[d2]=null; ws.homeFS[d2+"README.md"]=`# ${repoDir(ws.repo)}\n\ncloned from ${ws.repo}\n`; ws.homeFS[d2+"main.go"]='package main\n\nimport "fmt"\n\nfunc main() { fmt.Println("hello from your workspace") }\n'; ws.homeFS[d2+".git/"]=null}
      if(m==="ready"){ ws.status="Running"; ws.booted=true; ws.lastActive=now(); event("ok",`${ws.name} is Running on ${ws.node}`,ws.name); }
      save(); render(); }, d));
  }, 1500);
}
function stopWs(ws,why){ if(ws.status==="Stopped")return; ws.status="Stopped"; ws.imageFS=null; ws.aptInstalled=[]; ws.pod=null; ws.node=null; event("info",`${ws.name} stopped${why?" — "+why:""} (home volume kept)`,ws.name); save(); render(); }
function reaper(){ Object.values(S.workspaces).forEach(ws=>{ if(ws.status==="Running"&&ws.idle>0&&now()-ws.lastActive>ws.idle*60e3) stopWs(ws,`idle for ${ws.idle} min (reaper)`); }); }

/* ---- shell */
function shell(ws,line){
  const out=[]; const say=(s,c)=>out.push({s,c}); const parts=line.trim().split(/\s+/); const cmd=parts[0]||""; const args=parts.slice(1);
  const fs=()=>Object.assign({},ws.imageFS||{},ws.homeFS); const home="/home/dev";
  const norm=p=>{ if(!p)return ws.cwd; if(p==="~")return home; if(p.startsWith("~/"))p=home+p.slice(1); if(!p.startsWith("/"))p=ws.cwd.replace(/\/$/,"")+"/"+p; const segs=[]; p.split("/").forEach(s=>{ if(s==="..")segs.pop(); else if(s&&s!==".")segs.push(s); }); return "/"+segs.join("/"); };
  const isDir=p=>{p=p.replace(/\/$/,"")+"/"; if(p==="/")return true; const f=fs(); return Object.keys(f).some(k=>k.startsWith(p)) || p==="/home/" || p==="/etc/" || p==="/opt/" || p==="/usr/" || p==="/usr/local/"; };
  const readF=p=>{const f=fs(); return p in f && f[p]!==null ? f[p] : (p==="/workspace"?"-> /home/dev/workspace":undefined)};
  const writeF=(p,c)=>{ if(p.startsWith(home+"/")||p===home){ws.homeFS[p]=c} else { if(!ws.imageFS)ws.imageFS={}; ws.imageFS[p]=c; } };
  const list=p=>{ p=p.replace(/\/$/,"")+"/"; if(p==="//")p="/"; const f=fs(); const names=new Set(); Object.keys(f).forEach(k=>{ if(k.startsWith(p)&&k!==p){ const rest=k.slice(p.length).split("/"); names.add(rest[0]+(rest.length>1||k.endsWith("/")?"/":"")); } }); if(p==="/"){["home/","etc/","opt/","usr/","tmp/","workspace"].forEach(n=>names.add(n))} if(p==="/home/")names.add("dev/"); return [...names].sort(); };
  const have=c=>ws.languages.some(l=>CATALOG.languages[l].cmd===c)||ws.tools.some(t=>CATALOG.tools[t].cmd===c)||(ws.aptInstalled||[]).includes(c)||["ls","cd","pwd","cat","echo","mkdir","touch","rm","whoami","id","uname","hostname","env","printenv","sudo","apt","apt-get","git","ws-logs","clear","exit","help","history","date","uptime","df","free","nproc","which","ssh","exit","true","false"].includes(c);
  ws.homeFS["/home/dev/.bash_history"]=(ws.homeFS["/home/dev/.bash_history"]||"")+line+"\n"; ws.lastActive=now();
  switch(cmd){
    case "": break;
    case "help": say("Simulated shell. Try: ls, cd, pwd, cat FILE, echo TEXT > FILE, mkdir, touch, rm, whoami, id, uname -a, hostname, env,\n  "+ws.languages.map(l=>CATALOG.languages[l].cmd+" version").join(", ")+(ws.tools.length?", "+ws.tools.map(t=>CATALOG.tools[t].cmd+" --version").join(", "):"")+",\n  sudo apt install NAME, git status|log|clone URL, ws-logs, mcast-check, df -h, free -h, nproc, date, uptime, history, clear, exit","dim"); break;
    case "pwd": say(ws.cwd); break;
    case "cd": { const p=norm(args[0]||"~"); if(isDir(p)) ws.cwd=p==="/workspace"?home+"/workspace":p; else say(`bash: cd: ${args[0]}: No such file or directory`,"err"); break; }
    case "ls": { const p=norm(args.filter(a=>!a.startsWith("-"))[0]||ws.cwd); if(!isDir(p)&&readF(p)===undefined){say(`ls: cannot access '${args[0]}': No such file or directory`,"err");break} const l=isDir(p)?list(p):[p.split("/").pop()]; const all=args.includes("-a")||args.includes("-la")||args.includes("-al"); say(l.filter(n=>all||!n.startsWith(".")).join("  ")||""); break; }
    case "cat": { if(!args[0]){say("cat: missing file","err");break} const c=readF(norm(args[0])); c===undefined?say(`cat: ${args[0]}: No such file or directory`,"err"):say(c.replace(/\n$/,"")); break; }
    case "echo": { const i=args.indexOf(">"); const i2=args.indexOf(">>"); const txt=args.slice(0,i>=0?i:(i2>=0?i2:args.length)).join(" ").replace(/^"|"$/g,"").replace(/\$HOME/g,home).replace(/\$WORKSPACE_NAME/g,ws.name).replace(/\$WORKSPACE_LANGUAGES/g,ws.languages.join(",")).replace(/\$WORKSPACE_TOOLS/g,ws.tools.join(",")).replace(/\$USER/g,"dev"); if(i>=0)writeF(norm(args[i+1]),txt+"\n"); else if(i2>=0)writeF(norm(args[i2+1]),(readF(norm(args[i2+1]))||"")+txt+"\n"); else say(txt); break; }
    case "mkdir": { if(!args[0]){say("mkdir: missing operand","err");break} args.filter(a=>!a.startsWith("-")).forEach(a=>writeF(norm(a).replace(/\/$/,"")+"/",null)); break; }
    case "touch": args.forEach(a=>{const p=norm(a); if(readF(p)===undefined)writeF(p,"")}); break;
    case "rm": { const r=args.includes("-rf")||args.includes("-r"); args.filter(a=>!a.startsWith("-")).forEach(a=>{const p=norm(a); let hit=false; [ws.homeFS,ws.imageFS||{}].forEach(f=>Object.keys(f).forEach(k=>{ if(k===p||(r&&k.startsWith(p.replace(/\/$/,"")+"/"))){delete f[k];hit=true} })); if(!hit)say(`rm: cannot remove '${a}': No such file or directory`,"err")}); break; }
    case "whoami": say("dev"); break;
    case "id": say("uid=1000(dev) gid=1000(dev) groups=1000(dev)"); if(ws.profile!=="hardware")say("(inside a user namespace: root here is an unprivileged uid on the node)","dim"); break;
    case "uname": say(args.includes("-a")?`Linux ${ws.pod} 6.8.0-45-generic #45-Ubuntu SMP x86_64 GNU/Linux`:"Linux"); break;
    case "hostname": say(ws.pod); break;
    case "env": case "printenv": say(`HOME=/home/dev\nUSER=dev\nWORKSPACE_NAME=${ws.name}\nWORKSPACE_NAMESPACE=${S.ns}\nWORKSPACE_LANG=${ws.languages[0]}\nWORKSPACE_LANGUAGES=${ws.languages.join(",")}\nWORKSPACE_TOOLS=${ws.tools.join(",")}\nWORKSPACE_PROFILE=${ws.profile}\nWORKSPACE_MCAST_IFACE=${ws.multicast?"net1":""}\nARTIFACTORY_URL=https://artifactory.example.com/artifactory\nPATH=/home/dev/.local/bin:/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin`); break;
    case "date": say(new Date().toString()); break;
    case "uptime": say(` ${clock(now())} up ${Math.max(1,Math.round((now()-ws.startedAt)/6e4))} min,  1 user,  load average: 0.12, 0.08, 0.05`); break;
    case "nproc": say(CATALOG.sizes[ws.size].cpu); break;
    case "df": say(`Filesystem      Size  Used Avail Use% Mounted on\noverlay          98G   12G   86G  13% /\n/dev/pvc-home    ${CATALOG.sizes[ws.size].disk.replace("Gi","G")}  ${(1+Object.keys(ws.homeFS).length*0.1).toFixed(1)}G   ${CATALOG.sizes[ws.size].disk.replace("Gi","G")}   1% /home/dev`); break;
    case "free": say(`               total        used        free\nMem:           ${CATALOG.sizes[ws.size].mem.replace("Gi","G")}i        1.1Gi        ${CATALOG.sizes[ws.size].mem}`); break;
    case "which": { const c=args[0]||""; have(c)?say(["ls","cd","cat","echo"].includes(c)?`/usr/bin/${c}`:(ws.tools.some(t=>CATALOG.tools[t].cmd===c&&CATALOG.tools[t].src==="artifactory")?`/usr/local/bin/${c} -> /opt/tools/${ws.tools.find(t=>CATALOG.tools[t].cmd===c)}/${c}`:`/usr/local/bin/${c}`)):say(`${c} not found`,"err"); break; }
    case "history": say((ws.homeFS["/home/dev/.bash_history"]||"").trim().split("\n").map((l,i)=>`  ${i+1}  ${l}`).join("\n")); break;
    case "clear": ws.term=[]; break;
    case "exit": say("logout — (in the real system the SSH session ends; the workspace keeps running until the idle timeout)","dim"); break;
    case "sudo": { if(args[0]==="apt"||args[0]==="apt-get"){ const pk=args.find((a,i)=>i>1&&!a.startsWith("-")); if(args[1]==="install"&&pk){ ws.aptInstalled=ws.aptInstalled||[]; ws.aptInstalled.push(pk); say(`Reading package lists... Done\nSetting up ${pk} ...\n`+`note: ${pk} lives OUTSIDE /home/dev — it will be gone after the next stop/start. Add it in the Tools step instead.`,"dim"); } else say("sudo: apt: usage: sudo apt install NAME","err"); } else if(args[0]) { out.push(...shell(ws,args.join(" ")).map(o=>o)); } else say("usage: sudo COMMAND","err"); break; }
    case "apt": case "apt-get": say("E: Could not open lock file - are you root? (use sudo)","err"); break;
    case "git": { if(args[0]==="status"){ say(ws.cwd.includes("/workspace/")?"On branch main\nYour branch is up to date with 'origin/main'.\n\nnothing to commit, working tree clean":"fatal: not a git repository (or any of the parent directories): .git","err"===undefined?"":undefined) } else if(args[0]==="log"){ say(ws.cwd.includes("/workspace/")?"commit 9f3c2a1 (HEAD -> main, origin/main)\nAuthor: Demo Developer <demo@example.com>\nDate:   today\n\n    first commit":"fatal: not a git repository","err") } else if(args[0]==="clone"&&args[1]){ const d=repoDir(args[1]); const p=norm(d)+"/"; ws.homeFS[p]=null; ws.homeFS[p+"README.md"]=`# ${d}\n\ncloned from ${args[1]} (simulated)\n`; ws.homeFS[p+".git/"]=null; say(`Cloning into '${d}'...\nremote: (simulated)\nReceiving objects: 100%, done.`) } else if(args[0]==="push"||args[0]==="pull"||args[0]==="commit"){ say(`(simulated) git ${args[0]} ok — in the real workspace this uses the deploy key or token in the Secret`,"dim") } else say(`git ${args.join(" ")}: simulated git knows status, log, clone, pull, commit, push`,"dim"); break; }
    case "ws-logs": say(ws.bootLog.join("\n"),"dim"); break;
    case "mcast-check": ws.multicast?say(`joined 239.255.0.42:5007 on net1 (10.250.3.17)\nreceived 54 bytes from 10.250.3.17 — multicast OK on net1`):say("no address on net1: this workspace was created without the multicast network","err"); break;
    case "ssh": say("ssh: you are already inside the workspace (this terminal is the simulated SSH session)","dim"); break;
    case "true": case "false": break;
    default: {
      const l=ws.languages.find(l=>CATALOG.languages[l].cmd===cmd); const t=ws.tools.find(t=>CATALOG.tools[t].cmd===cmd);
      if(l){ say(args.join(" ").match(/version|^-V$|^--version$/)?CATALOG.languages[l].ver:(cmd==="go"&&args[0]==="run"?"hello from your workspace":`${cmd}: simulated — try '${cmd} version'`)); }
      else if(t){ say(args.join(" ").match(/version/)?CATALOG.tools[t].ver:`${cmd}: simulated (${CATALOG.tools[t].desc}) — try '${cmd} --version'`); }
      else if((ws.aptInstalled||[]).includes(cmd)) say(`${cmd}: simulated package from apt`);
      else { const missingLang=Object.entries(CATALOG.languages).find(([k,v])=>v.cmd===cmd); const missingTool=Object.entries(CATALOG.tools).find(([k,v])=>v.cmd===cmd); say(`bash: ${cmd}: command not found`,"err"); if(missingLang)say(`hint: ${missingLang[1].label} is not in this workspace — recreate it with ${missingLang[1].label} ticked (the disk is kept)`,"dim"); if(missingTool)say(`hint: add the '${missingTool[0]}' tool when creating (or sudo apt install ${missingTool[0]} for a one-off)`,"dim"); }
    }
  }
  return out;
}

const running=()=>Object.values(S.workspaces).filter(w=>w.status==="Running").length;
function home(){ return `

function create(){ const d=draft; return `

  <div class="grid sm:grid-cols-3 gap-4">
    <label class="block"><span class="text-sm" style="color:var(--muted)">Size</span><select class="select" id="f-size">${Object.entries(CATALOG.sizes).map(([k,v])=>`<option value="${k}" ${d.size===k?"selected":""}>${k} — ${v.cpu} CPU · ${v.mem} · ${v.disk}</option>`).join("")}</select></label>
    <label class="block"><span class="text-sm" style="color:var(--muted)">Profile</span><select class="select" id="f-profile"><option value="standard" ${d.profile==="standard"?"selected":""}>standard (user namespace)</option><option value="hardware" ${d.profile==="hardware"?"selected":""}>hardware lab (privileged, lab node)</option></select></label>
    <label class="block"><span class="text-sm" style="color:var(--muted)">Idle timeout (minutes, simulated)</span><input class="input" id="f-idle" type="number" min="0" value="${d.idle}"></label>
  </div>
  <label class="block"><span class="text-sm" style="color:var(--muted)">Repository to clone (optional)</span><input class="input" id="f-repo" value="${esc(d.repo)}" placeholder="git@github.com:acme/engine.git"></label>
  <label class="check ${d.multicast?"on":""}"><input type="checkbox" id="f-mcast" ${d.multicast?"checked":""}><span><span class="font-semibold">Multicast network</span><span class="block text-xs" style="color:var(--muted)">adds a second interface net1; try <code>mcast-check</code> in the shell</span></span></label>
  <div id="f-err" class="text-sm" style="color:var(--danger)"></div>
  <div class="flex gap-2"><button class="btn btn-p" id="f-go">Create workspace</button><button class="btn btn-s" id="f-clear" type="button">Clear</button></div>
</form>`; }
function wsCards(){ const ws=Object.values(S.workspaces).sort((a,b)=>b.createdAt-a.createdAt); if(!ws.length)return `<div class="card p-6 text-center"><p class="mb-3">No workspaces yet.</p><button class="btn btn-p" data-go="create">Create one</button></div>`;
  return `<div class="grid md:grid-cols-2 gap-3">${ws.map(w=>`<article class="card p-4 flex flex-col gap-2"><div class="flex items-start justify-between gap-2"><div><button class="text-lg font-semibold hover:underline" data-open="${w.name}">${esc(w.name)}</button><div class="text-xs" style="color:var(--muted)">${S.ns} · ${w.profile}${w.node?" · "+w.node:""}</div></div><span class="pill st-${w.status}">${w.status==="Starting"||w.status==="Pending"?'<span class="spin"></span>':""}${w.status}</span></div>
  <div class="flex flex-wrap gap-1">${w.languages.map((l,i)=>`<span class="chip">${CATALOG.languages[l].label}${i===0&&w.languages.length>1?" (main)":""}</span>`).join("")}${w.tools.map(t=>`<span class="chip" style="opacity:.8">${t}</span>`).join("")}${w.multicast?'<span class="chip">multicast</span>':""}</div>
  <div class="text-xs" style="color:var(--muted)">${CATALOG.sizes[w.size].cpu} CPU · ${CATALOG.sizes[w.size].mem} · disk ${CATALOG.sizes[w.size].disk} · idle ${w.idle} min · last active ${w.lastActive?ago(w.lastActive):"—"}</div>
  <div class="flex flex-wrap gap-2 mt-auto pt-1"><button class="btn btn-s btn-sm" data-open="${w.name}">Open &amp; shell</button>${w.status==="Stopped"?`<button class="btn btn-p btn-sm" data-start="${w.name}">Start</button>`:w.status==="Running"?`<button class="btn btn-o btn-sm" data-stop="${w.name}">Stop</button>`:""}<button class="btn btn-g btn-sm" data-del="${w.name}">Delete…</button></div></article>`).join("")}</div>`; }
function list(){ return `<div class="flex items-end justify-between gap-3 mb-4"><div><h1 class="text-2xl font-semibold">My workspaces</h1><p class="text-sm" style="color:var(--muted)">The reaper stops a Running workspace after its idle timeout (minutes here, hours for real).</p></div><button class="btn btn-p" data-go="create">Create</button></div>${wsCards()}`; }
function detail(){ const w=S.workspaces[S.sel]; if(!w)return list(); const live=w.status==="Running";
  return `<nav class="text-sm mb-2"><button class="underline" data-go="list">My workspaces</button> › ${esc(w.name)}</nav>
<div class="flex flex-wrap items-center justify-between gap-3 mb-4"><h1 class="text-2xl font-semibold flex items-center gap-3">${esc(w.name)} <span class="pill st-${w.status}">${w.status==="Starting"||w.status==="Pending"?'<span class="spin"></span>':""}${w.status}</span></h1>
<div class="flex gap-2">${w.status==="Stopped"?`<button class="btn btn-p" data-start="${w.name}">Start</button>`:w.status==="Running"?`<button class="btn btn-o" data-stop="${w.name}">Stop</button>`:""}<button class="btn btn-s" data-recreate="${w.name}">Recreate with changes</button><button class="btn btn-g" data-del="${w.name}">Delete…</button></div></div>
<div class="grid lg:grid-cols-3 gap-4">
  <section class="lg:col-span-2 card p-0 overflow-hidden flex flex-col"><div class="px-4 py-2 flex items-center justify-between text-sm" style="background:var(--surface2)"><span class="font-semibold">Terminal — <span class="mono">ssh ws-${esc(w.name)}</span> (simulated)</span><span style="color:var(--muted)">${live?"connected as dev":w.status==="Stopped"?"workspace stopped — press Start (or type anything: SSH auto-starts it)":"booting…"}</span></div>
    <div class="term" id="term">${(w.term||[]).map(l=>`<div class="${l.c||""}">${esc(l.s)}</div>`).join("")||`<div class="dim">${live?"Type help to see what this shell understands.":w.status==="Stopped"?"[press Enter to connect: a stopped workspace starts automatically]":"[waiting for sshd…]"}</div>`}</div>
    <form class="term-in" id="term-form" onsubmit="return false"><span class="p">dev@${esc(w.pod||("ws-"+w.name+"-0"))}:${esc(w.cwd.replace("/home/dev","~"))}$</span><input id="term-in" autocomplete="off" spellcheck="false" aria-label="command" ${w.status==="Starting"||w.status==="Pending"?"disabled":""}></form></section>
  <aside class="flex flex-col gap-4">
    <section class="card p-4 text-sm"><h2 class="font-semibold mb-2">Details</h2><div class="grid grid-cols-[auto_1fr] gap-x-3 gap-y-1"><span style="color:var(--muted)">Languages</span><span>${w.languages.map(l=>CATALOG.languages[l].label).join(", ")}</span><span style="color:var(--muted)">Tools</span><span>${w.tools.join(", ")||"none"}</span><span style="color:var(--muted)">Image</span><span class="mono text-xs">workspace/workspace-${w.languages[0]}:dev</span><span style="color:var(--muted)">Size</span><span>${CATALOG.sizes[w.size].cpu} CPU · ${CATALOG.sizes[w.size].mem} · ${CATALOG.sizes[w.size].disk}</span><span style="color:var(--muted)">Profile</span><span>${w.profile}${w.multicast?" · multicast":""}</span><span style="color:var(--muted)">Pod</span><span class="mono text-xs">${w.pod||"—"}${w.node?" on "+w.node:""}</span><span style="color:var(--muted)">Repo</span><span class="break-all">${esc(w.repo||"—")}</span><span style="color:var(--muted)">Idle timeout</span><span>${w.idle} min</span><span style="color:var(--muted)">Volume</span><span>ws-${esc(w.name)}-home (${Object.keys(w.homeFS).length} entries)</span></div></section>
    <section class="card p-4 text-sm"><h2 class="font-semibold mb-1">Boot log</h2><div class="log" id="bootlog">${(w.bootLog||[]).map(esc).join("\n")||"(stopped: start the workspace to see a boot)"}</div></section>
    ${(w.aptInstalled||[]).length?`<div class="callout">Installed with <code>sudo apt</code> this session: ${w.aptInstalled.map(esc).join(", ")}. They live outside /home/dev and will vanish at the next stop/start — try it.</div>`:""}
  </aside>
</div>`; }
function events(){ return `<h1 class="text-2xl font-semibold mb-3">Events</h1><p class="text-sm mb-3" style="color:var(--muted)">What the simulated cluster did, newest first (the real system shows the same in <code>kubectl get events</code> and the workspace page).</p>${S.events.length?`<div class="card divide-y" style="border-color:var(--border)">${S.events.map(e=>`<div class="px-4 py-2 text-sm flex gap-3"><span class="mono text-xs" style="color:var(--muted)">${clock(e.t)}</span><span class="pill ${e.kind==="ok"?"st-Running":e.kind==="warn"?"st-Starting":""}" style="font-size:.65rem">${e.kind}</span><span>${esc(e.msg)}</span></div>`).join("")}</div>`:'<div class="card p-6 text-center">Nothing yet.</div>'}`; }
function how(){ return `<h1 class="text-2xl font-semibold mb-3">How this simulation maps to the real system</h1>
<div class="grid md:grid-cols-2 gap-3 text-sm">
${[["This page","The real thing"],["localStorage key ws.sim","the Kubernetes API: StatefulSets, PVCs, Secrets in your namespace"],["Create → Pending → Starting → Running (seconds)","the CLI/portal apply manifests; the pod boots: sshd, tools, git clone (about a minute)"],["Boot log lines","the real entrypoint's log (ws-logs inside, workspace logs outside)"],["homeFS (survives stop/start)","the PersistentVolumeClaim mounted at /home/dev"],["imageFS + sudo apt installs (wiped on stop)","the container filesystem rebuilt from the image on every start"],["Terminal panel","VS Code Remote-SSH or ssh ws-NAME through kubectl exec"],["Idle timeout in minutes","the reaper CronJob: hours, based on SSH/editor activity"],["hardware profile → lab-node-1","privileged pod on the tainted lab node pool, one per node"],["Multicast → net1 + mcast-check","Multus macvlan interface or Cilium eBPF multicast"],["Reset demo","deleting your namespace (admins only, never automatic)"]].map(([a,b],i)=>`<div class="card p-3 ${i===0?"font-semibold":""}"><div>${a}</div></div><div class="card p-3 ${i===0?"font-semibold":""}">${b}</div>`).join("")}
</div>
<h2 class="text-lg font-semibold mt-6 mb-2">Things to try</h2>
<ol class="list-decimal pl-5 space-y-1 text-sm"><li>Create <code>engine</code> with Go <em>then</em> Python, tools ripgrep and cmake, a repository URL. Watch the boot log install them.</li><li>In the shell: <code>cd ~/workspace/engine && cat main.go</code>, <code>go version</code>, <code>python3 --version</code>, <code>rg --version</code>.</li><li><code>echo hello > ~/keep-me.txt</code> and <code>sudo apt install cowsay</code>. Stop, start, then <code>cat ~/keep-me.txt</code> (there) and <code>cowsay</code> (gone).</li><li>Set an idle timeout of 1 minute, leave the shell alone, watch the Events page: the reaper stops it. Press Enter in the terminal: SSH auto-starts it.</li><li>Create a <em>hardware</em> workspace and see where it lands; create one with multicast and run <code>mcast-check</code>.</li></ol>
<p class="text-sm mt-4" style="color:var(--muted)">The real portal (same look) is served by the Go API in <code>portal/</code>; this file is <code>portal/web/simulation.html</code>.</p>`; }

/* ============================================================ actions */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-go]"); if(!b)return;
  if(b.dataset.tab){setTab(b.dataset.tab);return} if(b.dataset.go){setTab(b.dataset.go);return}
  if(b.dataset.open){S.sel=b.dataset.open;setTab("detail");return}
  if(b.dataset.start){const w=S.workspaces[b.dataset.start]; if(w&&w.status==="Stopped"){event("info",`${w.name}: start requested`,w.name);startBoot(w)} return}
  if(b.dataset.stop){const w=S.workspaces[b.dataset.stop]; if(w&&confirm(`Stop ${w.name}? Running programs end; files under /home/dev are kept.`))stopWs(w,"stopped by you"); return}
  if(b.dataset.del){const w=S.workspaces[b.dataset.del]; if(!w)return; const purge=confirm(`Delete ${w.name}?\n\nOK = also delete its home volume (files gone)\nCancel = keep going to the next question`)||false; if(!purge&&!confirm(`Delete ${w.name} but KEEP the volume? (a new workspace named ${w.name} gets the files back)`))return; if(purge){delete S.workspaces[w.name];event("warn",`${w.name} deleted with its volume`,w.name)}else{w.status="Stopped";w.deleted=true;w.pod=null;w.imageFS=null;event("info",`${w.name} deleted, volume ws-${w.name}-home kept`,w.name)} save(); if(S.sel===w.name)S.sel=null; setTab("list"); return}
  if(b.dataset.recreate){const w=S.workspaces[b.dataset.recreate]; draft={name:w.name,languages:[...w.languages],tools:[...w.tools],size:w.size,repo:w.repo,profile:w.profile,multicast:w.multicast,idle:w.idle}; setTab("create"); toast("Recreating keeps the disk; change anything and press Create."); return}
  if(b.id==="f-go"){doCreate();return}
  if(b.id==="f-clear"){draft={name:"",languages:[],tools:[],size:"medium",repo:"",profile:"standard",multicast:false,idle:CATALOG.idleMinutes};render();return}
  if(b.id==="theme"){const d=!document.documentElement.classList.contains("dark");document.documentElement.classList.toggle("dark",d);S.theme=d?"dark":"light";save();return}
  if(b.id==="reset"){if(confirm("Forget every simulated workspace, file and event stored in this browser?")){localStorage.removeItem(KEY);load();render();toast("Simulation reset")}return}
});
document.addEventListener("change",e=>{
  const t=e.target; if(t.dataset.lang){draft.languages=t.checked?[...draft.languages,t.dataset.lang]:draft.languages.filter(l=>l!==t.dataset.lang);render()}
  else if(t.dataset.tool){draft.tools=t.checked?[...draft.tools,t.dataset.tool]:draft.tools.filter(x=>x!==t.dataset.tool);render()}
  else if(t.id==="f-size")draft.size=t.value; else if(t.id==="f-profile")draft.profile=t.value; else if(t.id==="f-mcast")draft.multicast=t.checked; else if(t.id==="f-idle")draft.idle=Math.max(0,parseInt(t.value||"0",10)); else if(t.id==="tab-select")setTab(t.value);
});
document.addEventListener("input",e=>{ if(e.target.id==="f-name")draft.name=e.target.value.trim(); if(e.target.id==="f-repo")draft.repo=e.target.value.trim(); });
function doCreate(){
  const err=$("#f-err"); const name=draft.name||draft.languages[0]||"";
  if(!draft.languages.length){err.textContent="Tick at least one language.";return} if(!NAME_RE.test(name)){err.textContent="Name: lowercase letters, digits and dashes only.";return}
  const old=S.workspaces[name]; if(old&&old.status!=="Stopped"&&!old.deleted&&!confirm(`${name} exists and is ${old.status}. Recreate it (disk kept)?`))return;
  const ws={name,languages:[...draft.languages],tools:draft.tools.filter(t=>!draft.languages.includes(t)),size:draft.size,repo:draft.repo,profile:draft.profile,multicast:draft.multicast,idle:draft.idle,createdAt:old?old.createdAt:now(),homeFS:old?old.homeFS:null,booted:!!old,cloned:!!(old&&old.cloned),cwd:"/home/dev",term:[],status:"Pending"};
  if(!ws.homeFS)ws.homeFS=freshHomeFS(ws); ws.deleted=false; S.workspaces[name]=ws; event("info",`${name} created: image workspace-${ws.languages[0]}:dev, tools ${ws.tools.join(",")||"none"}${old?" (existing volume reused)":""}`,name);
  draft={name:"",languages:[],tools:[],size:"medium",repo:"",profile:"standard",multicast:false,idle:CATALOG.idleMinutes}; S.sel=name; S.tab="detail"; startBoot(ws); toast(`Creating ${name}…`);
}
document.addEventListener("submit",e=>{ if(e.target.id!=="term-form")return; e.preventDefault(); const w=S.workspaces[S.sel]; if(!w)return; const inp=$("#term-in"); const line=inp.value; inp.value="";
  if(w.status==="Stopped"){ w.term=[{s:"ssh ws-"+w.name+": workspace is stopped — starting it (about a minute for real, seconds here)…",c:"dim"}]; event("info",`${w.name}: start requested by SSH connect`,w.name); startBoot(w); return }
  if(w.status!=="Running")return;
  w.term=w.term||[]; w.term.push({s:`dev@${w.pod}:${w.cwd.replace("/home/dev","~")}$ ${line}`,c:"p"}); const out=shell(w,line); w.term.push(...out); w.term=w.term.slice(-400); w.hist=(w.hist||[]).concat(line).slice(-100); w.hi=null; save(); render(); });
document.addEventListener("keydown",e=>{ if(e.target.id!=="term-in")return; const w=S.workspaces[S.sel]; if(!w||!w.hist)return; if(e.key==="ArrowUp"){e.preventDefault(); w.hi=w.hi===null||w.hi===undefined?w.hist.length-1:Math.max(0,w.hi-1); e.target.value=w.hist[w.hi]||""} if(e.key==="ArrowDown"){e.preventDefault(); if(w.hi===null||w.hi===undefined)return; w.hi=Math.min(w.hist.length,w.hi+1); e.target.value=w.hist[w.hi]||""} if(e.key==="l"&&e.ctrlKey){e.preventDefault(); w.term=[]; render()} });

/* ============================================================ boot the page */
load();
if(S.theme==="dark"||(S.theme===null&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");
Object.values(S.workspaces).forEach(w=>{ if(w.status==="Pending"||w.status==="Starting"){w.status="Stopped";w.pod=null} }); // a reload interrupted a boot
render(); setInterval(()=>{reaper(); if(S.tab==="list"||S.tab==="home")render();},5000);
</script>
</body>
