apiVersion: v1
data:
  kernel-headers.sh: |
    # Needed for out-of-tree module builds in the hardware profile.
    apt-get install -y "linux-headers-$(uname -r)"   # or dnf install kernel-devel-$(uname -r)
  labels-and-taints.sh: |
    kubectl label node "$NODE" devspaces.io/lab=true
    kubectl taint node "$NODE" devspaces.io/lab=true:NoSchedule
  nvidia.md: |
    GPUs: install the NVIDIA GPU Operator (or k8s-device-plugin) with a nodeSelector
    of devspaces.io/lab=true and the lab toleration; workspaces request
    `--device nvidia.com/gpu=1`. For CUDA *driver* development use the hardware
    profile with --host-path /dev --host-path /sys and no device plugin.
  vfio.sh: |
    # Bind a PCI function to vfio-pci so it can be handed to a Kata (kernel profile) workspace.
    modprobe vfio-pci
    echo "0000:03:00.0" > /sys/bus/pci/devices/0000:03:00.0/driver/unbind || true
    echo "vfio-pci" > /sys/bus/pci/devices/0000:03:00.0/driver_override
    echo "0000:03:00.0" > /sys/bus/pci/drivers_probe
kind: ConfigMap
metadata:
  name: lab-node-prep
  namespace: devspaces-system
---
apiVersion: v1
data:
  99-devspaces-multicast.conf: |
    # /etc/sysctl.d/99-devspaces-multicast.conf
    net.ipv4.conf.all.rp_filter = 0
    net.ipv4.conf.default.rp_filter = 0
    net.ipv4.igmp_max_memberships = 1024
    net.core.rmem_max = 26214400
    net.core.wmem_max = 26214400
  cilium-alternative.md: |
    If the cluster runs Cilium ≥ 1.16 in VXLAN mode you can instead enable its
    eBPF multicast datapath (beta) and skip Multus:
        cilium config set multicast-enabled true
        # per node: cilium-dbg bpf multicast group add 239.255.0.0/16 ... and
        # subscriber add <group> <pod-ip>   (Isovalent Enterprise automates this
        # with the IsovalentMulticastGroup CRD)
    Groups and subscribers are then programmed per pod IP, so pair it with a small
    controller or the `workspace` CLI hook of your choice. The NAD approach above
    is CNI-agnostic and needs no per-pod programming, which is why it is the default.
  kubelet-config-snippet.yaml: |
    # Only needed for lab profiles that set pod-level sysctls; the multicast
    # NAD itself needs nothing here (its tuning plugin acts inside the pod netns).
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    allowedUnsafeSysctls:
      - "net.*"
  promisc.sh: |
    # macvlan bridge mode needs the master NIC to accept multicast for all child MACs.
    ip link set dev eth0 allmulticast on
kind: ConfigMap
metadata:
  name: multicast-node-prep
  namespace: devspaces-system
---
apiVersion: v1
data:
  note: |
    Pass `--global-namespaces=devspaces-system` to the Multus daemonset (thin plugin)
    or set "globalNamespaces": "devspaces-system" in the thick-plugin daemon config.
kind: ConfigMap
metadata:
  name: multus-global-namespaces
  namespace: devspaces-system
---
apiVersion: v1
data:
  conf.yaml: |
    - devicematch: ^ttyUSB[0-9]*$
      nummaxdevices: 1
    - devicematch: ^ttyACM[0-9]*$
      nummaxdevices: 1
    - devicematch: ^i2c-[0-9]*$
      nummaxdevices: 1
    - devicematch: ^spidev[0-9]\.[0-9]$
      nummaxdevices: 1
    - devicematch: ^video[0-9]*$
      nummaxdevices: 1
    - devicematch: ^gpiochip[0-9]*$
      nummaxdevices: 1
    - devicematch: ^uinput$
      nummaxdevices: 4
    - devicematch: ^kvm$
      nummaxdevices: 8
    - devicematch: ^fuse$
      nummaxdevices: 20
kind: ConfigMap
metadata:
  name: smarter-device-manager
  namespace: devspaces-system
---
apiVersion: v1
data:
  catalog.json: |
    {
      "$comment": "Source of truth for what `workspace create` may build. kustomize publishes this file as ConfigMap devspaces-system/workspace-catalog; the CLI reads it from the cluster and falls back to a built-in copy. Admins add a language or tool here (plus an images/features/<name>/install.sh) — no CLI release needed.",

      "registry": "ghcr.io/example/devspaces",
      "tag": "2026.10",
      "pullSecret": "",

      "defaults": {
        "profile": "standard",
        "isolation": "userns",
        "cpu": "4",
        "memory": "8Gi",
        "cpuRequest": "1",
        "memoryRequest": "2Gi",
        "ephemeralStorage": "20Gi",
        "size": "30Gi",
        "storageClass": "",
        "idleTimeout": "4h"
      },

      "languages": {
        "base":   { "image": "workspace-base",   "description": "Ubuntu 24.04, compilers, git, ssh — no language runtime" },
        "python": { "image": "workspace-python", "description": "Python 3 + uv/pip/venv" },
        "go":     { "image": "workspace-go",     "description": "Go toolchain (latest stable)" },
        "rust":   { "image": "workspace-rust",   "description": "Rust stable via rustup + cargo" },
        "java":   { "image": "workspace-java",   "description": "OpenJDK 21 + Maven + Gradle" },
        "node":   { "image": "workspace-node",   "description": "Node.js LTS + npm/pnpm/yarn (corepack)" },
        "cpp":    { "image": "workspace-cpp",    "description": "GCC/Clang, CMake, Ninja, GDB, Valgrind, clangd" }
      },

      "tools": {
        "git":        { "builtin": true, "description": "git + git-lfs (always present)" },
        "cmake":      { "description": "CMake + Ninja" },
        "gdb":        { "description": "gdb, lldb, strace, ltrace, valgrind" },
        "docker-cli": { "description": "docker CLI + buildx + compose (daemon: DOCKER_HOST or a dind sidecar in the lab tier)" },
        "kubectl":    { "description": "kubectl + helm (kustomize is built into kubectl)" },
        "protobuf":   { "description": "protoc + gRPC plugin" },
        "mcast":      { "description": "multicast test kit: iperf2, smcroute, tcpdump, socat, mcast-check" },
        "python":     { "description": "add Python 3 to another language image" },
        "go":         { "description": "add Go to another language image" },
        "rust":       { "description": "add Rust to another language image" },
        "node":       { "description": "add Node.js to another language image" },
        "java":       { "description": "add OpenJDK/Maven/Gradle to another language image" },
        "cpp":        { "description": "add the C/C++ toolchain to another language image" }
      },

      "profiles": {
        "standard": {
          "description": "Default. root inside a user namespace, Pod Security 'baseline', no host access.",
          "tier": "standard",
          "capabilities": [
            "AUDIT_WRITE", "CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "KILL", "MKNOD",
            "NET_BIND_SERVICE", "SETFCAP", "SETGID", "SETPCAP", "SETUID", "SYS_CHROOT"
          ]
        },
        "hardware": {
          "description": "Privileged pod on the tainted lab node pool with the HOST kernel: device plugins, /dev, host kernel modules. One lab workspace per node.",
          "tier": "lab",
          "privileged": true,
          "isolation": "none",
          "hostPaths": ["/lib/modules", "/usr/src", "/lib/firmware"],
          "nodeSelector": { "devspaces.io/lab": "true" },
          "tolerations": [
            { "key": "devspaces.io/lab", "operator": "Equal", "value": "true", "effect": "NoSchedule" }
          ],
          "exclusiveNode": true
        },
        "kernel": {
          "description": "Kata Containers micro-VM on the lab pool: your own guest kernel, safe to insmod/crash. PCI devices via VFIO device plugins.",
          "tier": "lab",
          "isolation": "kata",
          "capabilities": [
            "AUDIT_WRITE", "CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "KILL", "MKNOD",
            "NET_ADMIN", "NET_BIND_SERVICE", "NET_RAW", "SETFCAP", "SETGID", "SETPCAP", "SETUID",
            "SYS_ADMIN", "SYS_CHROOT", "SYS_MODULE", "SYS_PTRACE", "SYS_RAWIO", "IPC_LOCK"
          ],
          "nodeSelector": { "devspaces.io/lab": "true" },
          "tolerations": [
            { "key": "devspaces.io/lab", "operator": "Equal", "value": "true", "effect": "NoSchedule" }
          ],
          "exclusiveNode": false
        }
      },

      "isolation": {
        "userns": { "hostUsers": false,
                    "description": "Linux user namespace (K8s >= 1.36 GA; kernel >= 6.3). Container root maps to an unprivileged host UID." },
        "gvisor": { "runtimeClass": "gvisor",
                    "description": "gVisor (runsc) syscall sandbox. No userns needed; limited multicast/raw-socket support." },
        "kata":   { "runtimeClass": "kata",
                    "description": "Kata Containers micro-VM with its own guest kernel." },
        "none":   { "description": "Plain runc, shared kernel, host UIDs. Lab tier only." }
      },

      "networking": {
        "clusterCIDRs": ["10.244.0.0/16", "10.96.0.0/12"],
        "blockedEgress": ["169.254.169.254/32"],
        "multicast": {
          "$comment": "NetworkAttachmentDefinition attached when --multicast is given; see deploy/platform/networking/",
          "nad": "devspaces-system/mcast",
          "iface": "net1"
        }
      }
    }
kind: ConfigMap
metadata:
  name: workspace-catalog
  namespace: devspaces-system
---
apiVersion: v1
data:
  example-tool.sh: |
    #!/usr/bin/env bash
    # Example hot-added feature. Admins put installers in the `workspace-features`
    # ConfigMap (deploy/platform/kustomization.yaml); the file name minus .sh is the
    # tool name developers pass to --tools, after adding it to catalog.json "tools".
    # Runs as root at pod boot; must be idempotent; never write to /home/dev.
    set -Eeuo pipefail
    . /opt/workspace/lib.sh
    apt_install shellcheck bats
    profile_env example-tool 'export EXAMPLE_TOOL=1'
kind: ConfigMap
metadata:
  name: workspace-features
  namespace: devspaces-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: workspace-reaper
  namespace: devspaces-system
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 540
      backoffLimit: 1
      template:
        spec:
          containers:
          - args:
            - admin
            - reap
            - --all-namespaces
            - --verbose
            env:
            - name: HOME
              value: /tmp
            image: ghcr.io/example/devspaces/workspace-cli:2026.10
            name: reaper
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /tmp
              name: tmp
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: workspace-reaper
          volumes:
          - emptyDir: {}
            name: tmp
  schedule: '*/10 * * * *'
  successfulJobsHistoryLimit: 3
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devspaces-protect-tenant-policies
  namespace: devspaces-system
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: devspaces.io/tenant
        operator: Exists
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - DELETE
      - UPDATE
      resources:
      - networkpolicies
  validations:
  - expression: '!(oldObject.metadata.name in [''tenant-ingress'', ''tenant-egress''])
      || request.userInfo.groups.exists(g, g in [''system:masters'', ''devspaces:platform-admins'',
      ''system:serviceaccounts:argocd'', ''system:serviceaccounts:flux-system''])'
    message: the tenant-ingress/tenant-egress policies are managed by the platform
      (group devspaces:platform-admins)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devspaces-workspace-guardrails
  namespace: devspaces-system
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: devspaces.io/tenant
        operator: Exists
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '!(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID)
      && object.spec.hostPID) && !(has(object.spec.hostIPC) && object.spec.hostIPC)'
    message: workspaces may not use hostNetwork, hostPID or hostIPC (use a device
      plugin or SR-IOV instead)
  - expression: variables.isLab || (has(object.spec.hostUsers) && object.spec.hostUsers
      == false) || (has(object.spec.runtimeClassName) && object.spec.runtimeClassName
      in ['gvisor', 'kata'])
    message: standard-tier workspaces must set hostUsers=false or run under the gvisor/kata
      RuntimeClass
  - expression: variables.isLab || !variables.allContainers.exists(c, has(c.securityContext)
      && has(c.securityContext.privileged) && c.securityContext.privileged)
    message: privileged containers are only allowed in *-lab namespaces (workspace
      create --profile hardware)
  - expression: variables.hostPaths.all(p, variables.isLab && variables.allowedHostPathPrefixes.exists(a,
      p == a || p.startsWith(a + '/')))
    message: hostPath volumes must be under /dev, /sys, /lib/modules, /usr/src, /lib/firmware
      or /run/udev and only in lab namespaces
  - expression: '!variables.hostPaths.exists(p, p.startsWith(''/var/run'') || p.startsWith(''/run/containerd'')
      || p.startsWith(''/var/lib/kubelet'') || p.startsWith(''/etc/kubernetes''))'
    message: mounting runtime or kubelet state from the host is not allowed
  - expression: '!variables.isLab || (has(object.spec.nodeSelector) && ''devspaces.io/lab''
      in object.spec.nodeSelector)'
    message: lab-tier workspaces must select the lab node pool (nodeSelector devspaces.io/lab=true)
  variables:
  - expression: has(namespaceObject.metadata.labels) && 'devspaces.io/tier' in namespaceObject.metadata.labels
      && namespaceObject.metadata.labels['devspaces.io/tier'] == 'lab'
    name: isLab
  - expression: 'object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers
      : [])'
    name: allContainers
  - expression: 'has(object.spec.volumes) ? object.spec.volumes.filter(v, has(v.hostPath)).map(v,
      v.hostPath.path) : []'
    name: hostPaths
  - expression: '[''/dev'', ''/sys'', ''/lib/modules'', ''/usr/src'', ''/lib/firmware'',
      ''/run/udev'']'
    name: allowedHostPathPrefixes
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devspaces-protect-tenant-policies
  namespace: devspaces-system
spec:
  policyName: devspaces-protect-tenant-policies
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devspaces-workspace-guardrails
  namespace: devspaces-system
spec:
  policyName: devspaces-workspace-guardrails
  validationActions:
  - Deny
  - Audit
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: mcast
  namespace: devspaces-system
spec:
  config: |
    {
      "cniVersion": "0.4.0",
      "name": "mcast",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eth0",
          "mode": "bridge",
          "mtu": 1500,
          "ipam": {
            "type": "whereabouts",
            "range": "10.250.0.0/16",
            "exclude": ["10.250.0.0/30", "10.250.255.255/32"],
            "routes": [
              { "dst": "224.0.0.0/4" }
            ]
          }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv4.conf.net1.rp_filter": "0",
            "net.ipv4.conf.all.rp_filter": "0",
            "net.ipv4.igmp_max_memberships": "1024",
            "net.ipv4.igmp_max_msf": "64",
            "net.ipv4.conf.net1.force_igmp_version": "0",
            "net.core.rmem_max": "26214400"
          }
        }
      ]
    }
---
apiVersion: node.k8s.io/v1
handler: runsc
kind: RuntimeClass
metadata:
  name: gvisor
overhead:
  podFixed:
    cpu: 100m
    memory: 128Mi
scheduling:
  nodeSelector:
    devspaces.io/runtime-gvisor: "true"
---
apiVersion: node.k8s.io/v1
handler: kata-qemu
kind: RuntimeClass
metadata:
  name: kata
overhead:
  podFixed:
    cpu: 250m
    memory: 350Mi
scheduling:
  nodeSelector:
    devspaces.io/lab: "true"
  tolerations:
  - effect: NoSchedule
    key: devspaces.io/lab
    operator: Equal
    value: "true"
