{{- if and .Values.portal.enabled .Values.ingress.enabled .Values.ingress.gatewayAPI.enabled }}
# Gateway API route (Application Gateway for Containers on AKS, Envoy Gateway, Istio…). The Gateway
# itself is cluster-layer (deploy/cluster/providers/azure/10-aks.sh creates one for AKS).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workspaces
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gatewayAPI.gatewayName }}
      namespace: {{ .Values.ingress.gatewayAPI.gatewayNamespace | default .Release.Namespace }}
  hostnames: [{{ .Values.ingress.host | quote }}]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs:
        - name: {{ if .Values.oauth2Proxy.enabled }}oauth2-proxy{{ else }}workspace-portal{{ end }}
          port: {{ if .Values.oauth2Proxy.enabled }}4180{{ else }}80{{ end }}
{{- else if and .Values.portal.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspaces
  namespace: {{ .Release.Namespace }}
  {{- with .Values.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ if .Values.oauth2Proxy.enabled }}oauth2-proxy{{ else }}workspace-portal{{ end }}
                port: { name: http }
{{- end }}
