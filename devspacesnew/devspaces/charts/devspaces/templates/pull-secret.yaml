{{- if .Values.pullSecret.dockerconfigjson }}
# Registry login, copied into each tenant namespace by `workspace admin onboard`.
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: {{ .Values.global.pullSecretName }}
  namespace: {{ .Release.Namespace }}
data:
  .dockerconfigjson: {{ .Values.pullSecret.dockerconfigjson }}
{{- end }}
