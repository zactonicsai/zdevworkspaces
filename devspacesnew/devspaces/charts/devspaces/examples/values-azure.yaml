# Azure AKS — complete example values for charts/devspaces.
# Pair with the cluster layer in deploy/cluster/providers/azure/ (scripts 00–60) and the
# step-by-step in docs/azure-aks-setup.md. Install:
#   helm upgrade --install devspaces charts/devspaces -n devspaces-system --create-namespace \
#     -f charts/devspaces/examples/values-azure.yaml \
#     -f deploy/cluster/providers/azure/entra.values.yaml      # generated by 30-entra.sh (ids, issuer)
# Secrets are NOT in values: Key Vault → CSI driver → Secret devspaces-system/oauth2-proxy (40-keyvault.sh).

global:
  registry: devspacesacr.azurecr.io/devspaces     # ACR attached to AKS (10-aks.sh) → no pull secret needed
  tag: "dev"
  pullSecretName: ""                               # set (and pullSecret.dockerconfigjson) only when pulling from Artifactory

catalogOverrides:
  artifactory:
    url: https://artifactory.corp.example/artifactory   # tools/packages still come from Artifactory; images from ACR (or both from Artifactory)
    repos: { docker: devspaces-docker, github: github-remote, apt: ubuntu-remote, pypi: pypi-remote, npm: npm-remote, go: go-remote, maven: maven-remote, cargo: cargo-remote }
  defaults:
    size: 50Gi
    storage: fast                                  # catalog alias below; developers may pick another per workspace
    idleTimeout: 4h
  networking:
    clusterCIDRs: ["10.244.0.0/16", "10.96.0.0/16", "10.10.0.0/16"]   # pods, services, VNet (tenant egress policy excludes these)
    blockedEgress: ["169.254.169.254/32"]                              # Azure IMDS: workspaces must not read node identity tokens
    multicast:
      mode: cilium                                 # only works with BYO Cilium (60-multicast-cilium.sh); remove the `mcast` tool otherwise
      groups: ["239.255.0.0/24"]
    mesh: none                                     # none | istio-ambient  (deploy/platform/mesh/, docs/workspace-networking.md)

# Home drives and shared drives (20-storage.yaml). `name` is what developers see and type
# (`wsctl create --storage fast`, portal "Storage" dropdown); `storageClass` is the Kubernetes name.
storage:
  choices:
    - name: fast
      storageClass: workspace-home-premium
      kind: home
      accessModes: [ReadWriteOnce]
      description: "Premium SSD disk. Fast builds. Default."
      default: true
    - name: standard
      storageClass: workspace-home-standard
      kind: home
      accessModes: [ReadWriteOnce]
      description: "Standard SSD disk. Cheaper; fine for editing and small builds."
    - name: shared
      storageClass: workspace-shared-files
      kind: shared
      accessModes: [ReadWriteMany]
      description: "Azure Files share. Mount in several workspaces at once and share with teammates (/shared/<name>)."
      default: true                                # default for kind=shared
  snapshotClass: csi-azuredisk-vsc                 # VolumeSnapshotClass for `wsctl drives snapshot`
  protectHomeDrives: true                          # admission policy: a home PVC can only be deleted after devspaces.io/allow-delete=true

# Team "virtual namespaces": every workspace created in ws-proj-<name> can talk to every other,
# and every member sees them. Members are Entra identities (UPN = e-mail) or group names.
projects:
  - name: checkout
    members: ["alice@corp.example", "bob@corp.example"]
    quota: { cpu: "64", memory: "256Gi", storage: "2Ti" }
  - name: platform-lab
    members: ["group:devspaces-platform-admins"]
    lab: true                                      # also create ws-proj-platform-lab-lab (privileged tier)

multicast:
  mode: cilium
  groups: ["239.255.0.0/24"]

runtimeClasses:
  gvisor: { enabled: false }                       # not available on AKS node images; use Kata on the lab pool instead
  kata:   { enabled: true, handler: kata-qemu }    # AKS: `--workload-runtime KataMshvVmIsolation` pools, or kata-deploy on the lab pool

admission:
  enabled: true
  platformAdminGroups: ["system:masters", "devspaces:platform-admins"]   # 30-entra.sh adds the Entra group object id

portal:
  enabled: true
  replicas: 2
  userHeader: X-Forwarded-Email
  groupsHeader: X-Forwarded-Groups
  trustedProxies: "10.244.0.0/16"                  # the pod CIDR: only oauth2-proxy pods may assert identities
  # Bearer tokens (wsctl, automation, APIM): validated by the portal itself against Entra ID.
  oidc:
    issuer: https://login.microsoftonline.com/TENANT-ID/v2.0   # overwritten by entra.values.yaml
    audience: api://devspaces
    userClaim: preferred_username                  # Entra v2 access tokens: the UPN (= e-mail in most tenants)
    groupsClaim: groups
    jwksCacheMinutes: 60
  # Optional: a public hint for the CLI so `wsctl login --portal https://workspaces.corp.example` needs no other flags
  cliLogin:
    tenant: TENANT-ID
    clientId: CLI-APP-ID                           # devspaces-cli app registration
    scope: api://devspaces/Workspaces.ReadWrite
  existingSecret: ""                               # Artifactory read token (key `token`) if the portal should list images/tools

oauth2Proxy:
  enabled: true
  provider: entra-id                               # oauth2-proxy >= 7.6 has a native Entra ID provider (groups, v2 endpoints)
  issuerUrl: https://login.microsoftonline.com/TENANT-ID/v2.0
  emailDomain: corp.example
  groupsClaim: groups
  existingSecret: oauth2-proxy                     # created by the Secrets Store CSI driver from Key Vault (40-keyvault.sh)
  secretProviderClass: devspaces-keyvault          # mount so the Secret gets synced
  serviceAccount: devspaces-secrets                # workload identity (annotation azure.workload.identity/client-id)
  extraArgs:
    - --oidc-groups-claim=groups
    - --scope=openid profile email
    - --cookie-secure=true
    - --cookie-samesite=lax

ingress:
  enabled: true
  className: azure-alb-external                    # Application Gateway for Containers (Gateway API) — or webapprouting.kubernetes.azure.com / nginx
  host: workspaces.corp.example
  gatewayAPI:
    enabled: true                                  # emit an HTTPRoute instead of an Ingress
    gatewayName: devspaces-gateway
    gatewayNamespace: devspaces-system
  annotations: {}
  tls:
    enabled: true
    secretName: workspaces-tls                     # cert-manager (ClusterIssuer letsencrypt) or a Key Vault certificate synced by the CSI driver

networkPolicy:
  enabled: true

reaper:
  enabled: true
  schedule: "*/10 * * * *"
