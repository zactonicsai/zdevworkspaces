# Sandboxes selectable with `workspace create --isolation gvisor|kata`.
# The handler must exist in containerd on the nodes you label; nodes without it
# are excluded via scheduling.nodeSelector.
#
#   gVisor:  https://gvisor.dev/docs/user_guide/containerd/quick_start/
#            containerd: [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
#                          runtime_type = "io.containerd.runsc.v1"
#   Kata:    kata-deploy DaemonSet installs the shim and labels nodes
#            https://github.com/kata-containers/kata-containers/tree/main/tools/packaging/kata-deploy
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    devspaces.io/runtime-gvisor: "true"
overhead:
  podFixed:
    cpu: 100m
    memory: 128Mi
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata-qemu          # or kata-clh / kata-fc depending on your kata-deploy config
scheduling:
  nodeSelector:
    devspaces.io/lab: "true"
  tolerations:
    - key: devspaces.io/lab
      operator: Equal
      value: "true"
      effect: NoSchedule
overhead:
  podFixed:
    cpu: 250m
    memory: 350Mi
