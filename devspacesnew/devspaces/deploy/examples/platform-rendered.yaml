              "k9s"
            ]
          }
        },
        "direnv": {
          "category": "shell",
          "description": "direnv \u2014 per-directory environment variables",
          "docs": "https://direnv.net/",
          "artifact": {
            "repo": "github",
            "path": "direnv/direnv/releases/download/v{version}/direnv.linux-{goarch}",
            "version": "2.36.0",
            "install": "binary",
            "bin": [
              "direnv"
            ]
          }
        },
        "duckdb": {
          "category": "data",
          "description": "DuckDB \u2014 in-process analytics database CLI",
          "docs": "https://duckdb.org/docs/",
          "artifact": {
            "repo": "github",
            "path": "duckdb/duckdb/releases/download/v{version}/duckdb_cli-linux-{goarch}.zip",
            "version": "1.3.0",
            "install": "zip",
            "bin": [
              "duckdb"
            ]
          }
        }
      },
      "profiles": {
        "standard": {
          "label": "Standard",
          "description": "Default. root inside a user namespace, Pod Security 'baseline', no host access.",
          "tier": "standard",
          "capabilities": [
            "AUDIT_WRITE",
            "CHOWN",
            "DAC_OVERRIDE",
            "FOWNER",
            "FSETID",
            "KILL",
            "MKNOD",
            "NET_BIND_SERVICE",
            "SETFCAP",
            "SETGID",
            "SETPCAP",
            "SETUID",
            "SYS_CHROOT"
          ]
        },
        "hardware": {
          "label": "Hardware lab",
          "description": "Privileged pod on the tainted lab node pool with the HOST kernel: device plugins, /dev, host kernel modules. One lab workspace per node.",
          "tier": "lab",
          "privileged": true,
          "isolation": "none",
          "hostPaths": [
            "/lib/modules",
            "/usr/src",
            "/lib/firmware"
          ],
          "nodeSelector": {
            "devspaces.io/lab": "true"
          },
          "tolerations": [
            {
              "key": "devspaces.io/lab",
              "operator": "Equal",
              "value": "true",
              "effect": "NoSchedule"
            }
          ],
          "exclusiveNode": true
        },
        "kernel": {
          "label": "Kernel lab (micro-VM)",
          "description": "Kata Containers micro-VM on the lab pool: your own guest kernel, safe to insmod/crash. PCI devices via VFIO device plugins.",
          "tier": "lab",
          "isolation": "kata",
          "capabilities": [
            "AUDIT_WRITE",
            "CHOWN",
            "DAC_OVERRIDE",
            "FOWNER",
            "FSETID",
            "KILL",
            "MKNOD",
            "NET_ADMIN",
            "NET_BIND_SERVICE",
            "NET_RAW",
            "SETFCAP",
            "SETGID",
            "SETPCAP",
            "SETUID",
            "SYS_ADMIN",
            "SYS_CHROOT",
            "SYS_MODULE",
            "SYS_PTRACE",
            "SYS_RAWIO",
            "IPC_LOCK"
          ],
          "nodeSelector": {
            "devspaces.io/lab": "true"
          },
          "tolerations": [
            {
              "key": "devspaces.io/lab",
              "operator": "Equal",
              "value": "true",
              "effect": "NoSchedule"
            }
          ],
          "exclusiveNode": false
        }
      },
      "isolation": {
        "userns": {
          "hostUsers": false,
          "description": "Linux user namespace (K8s >= 1.36 GA; kernel >= 6.3). Container root maps to an unprivileged host UID."
        },
        "gvisor": {
          "runtimeClass": "gvisor",
          "description": "gVisor (runsc) syscall sandbox. No userns needed; limited multicast/raw-socket support."
        },
        "kata": {
          "runtimeClass": "kata",
          "description": "Kata Containers micro-VM with its own guest kernel."
        },
        "none": {
          "description": "Plain runc, shared kernel, host UIDs. Lab tier only."
        }
      },
      "devices": {
        "$comment": "Shown as choices in the portal's hardware step; any resource=quantity still works on the CLI.",
        "nvidia.com/gpu": {
          "label": "NVIDIA GPU",
          "quantity": "1",
          "docs": "https://github.com/NVIDIA/k8s-device-plugin#readme"
        },
        "smarter-devices/ttyUSB0": {
          "label": "USB serial (ttyUSB0)",
          "quantity": "1",
          "docs": "https://gitlab.com/arm-research/smarter/smarter-device-manager"
        },
        "smarter-devices/ttyACM0": {
          "label": "USB CDC serial (ttyACM0)",
          "quantity": "1",
          "docs": "https://gitlab.com/arm-research/smarter/smarter-device-manager"
        },
        "smarter-devices/i2c-1": {
          "label": "I2C bus 1",
          "quantity": "1",
          "docs": "https://www.kernel.org/doc/html/latest/i2c/dev-interface.html"
        },
        "smarter-devices/video0": {
          "label": "Camera (video0)",
          "quantity": "1",
          "docs": "https://www.kernel.org/doc/html/latest/userspace-api/media/v4l/v4l2.html"
        },
        "intel.com/sriov_netdevice": {
          "label": "SR-IOV network VF",
          "quantity": "1",
          "docs": "https://github.com/k8snetworkplumbingwg/sriov-network-device-plugin#readme"
        },
        "hugepages-2Mi": {
          "label": "Hugepages 2Mi (DPDK)",
          "quantity": "1Gi",
          "docs": "https://kubernetes.io/docs/tasks/manage-hugepages/scheduling-hugepages/"
        }
      },
      "networking": {
        "clusterCIDRs": [
          "10.244.0.0/16",
          "10.96.0.0/12"
        ],
        "blockedEgress": [
          "169.254.169.254/32"
        ],
        "multicast": {
          "$comment": "mode=multus: a second interface (net1) from the NetworkAttachmentDefinition below. mode=cilium: Cilium's eBPF multicast datapath on the pod's normal interface (VXLAN tunnel mode, kernel >= 5.10 amd64 / 6.0 arm64, beta); `groups` are programmed cluster-wide by deploy/cluster/multicast-cilium.sh. --multicast works the same way for developers in both modes.",
          "mode": "multus",
          "nad": "devspaces-system/mcast",
          "iface": "net1",
          "groups": [
            "239.255.0.0/24"
          ]
        },
        "mesh": {
          "$comment": "none (default): plain NetworkPolicy + DNS. istio-ambient: tenant namespaces are labelled istio.io/dataplane-mode=ambient at onboarding (mTLS identity, L7 policy, header routing) \u2014 see deploy/platform/mesh/ and docs/workspace-networking.md.",
          "mode": "none"
        },
        "links": {
          "$comment": "Developers may link a workspace to another developer's workspace (NetworkPolicy peer-* in their own namespace, consent on both sides). Set enabled=false to hide the feature.",
          "enabled": true
        }
      },
      "storage": {
        "$comment": "Home drives (the PVC behind /home/dev) and shared drives (ReadWriteMany, mounted under /shared/<name>). `choices` are what developers pick with --storage / the Storage step; the storageClass must exist on the cluster (deploy/cluster/CONTRACT.md C6/C7). kind=home classes should use reclaimPolicy Retain + allowVolumeExpansion; kind=shared needs a ReadWriteMany driver (Azure Files, EFS, Filestore, NFS). An empty storageClass means the cluster default.",
        "choices": [
          {
            "name": "fast",
            "label": "Fast SSD",
            "kind": "home",
            "storageClass": "",
            "accessModes": [
              "ReadWriteOnce"
            ],
            "description": "Default. One disk per workspace, kept when the workspace is deleted; snapshots supported on CSI drivers.",
            "default": true
          },
          {
            "name": "standard",
            "label": "Standard",
            "kind": "home",
            "storageClass": "",
            "accessModes": [
              "ReadWriteOnce"
            ],
            "description": "Cheaper disk for occasional workspaces. Same persistence rules."
          },
          {
            "name": "shared",
            "label": "Shared folder",
            "kind": "shared",
            "storageClass": "",
            "accessModes": [
              "ReadWriteMany"
            ],
            "description": "A folder several workspaces (and, if you share it, several developers) mount at the same time under /shared/<name>.",
            "default": true
          }
        ],
        "snapshotClass": "",
        "protectHomeDrives": true,
        "sharedMountPath": "/shared"
      }
    }
kind: ConfigMap
metadata:
  name: workspace-catalog
  namespace: devspaces-system
---
apiVersion: v1
data:
  example-tool.sh: |
    #!/usr/bin/env bash
    # Example hot-added feature. Admins put installers in the `workspace-features`
    # ConfigMap (deploy/platform/kustomization.yaml); the file name minus .sh is the
    # tool name developers pass to --tools, after adding it to catalog.json "tools".
    # Runs as root at pod boot; must be idempotent; never write to /home/dev.
    set -Eeuo pipefail
    . /opt/workspace/lib.sh
    apt_install shellcheck bats
    profile_env example-tool 'export EXAMPLE_TOOL=1'
kind: ConfigMap
metadata:
  name: workspace-features
  namespace: devspaces-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: workspace-reaper
  namespace: devspaces-system
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 540
      backoffLimit: 1
      template:
        spec:
          containers:
          - args:
            - admin
            - reap
            - --all-namespaces
            - --verbose
            env:
            - name: HOME
              value: /tmp
            image:workspace/workspace-portal:dev-cli:2026.10
            name: reaper
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /tmp
              name: tmp
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: workspace-reaper
          volumes:
          - emptyDir: {}
            name: tmp
  schedule: '*/10 * * * *'
  successfulJobsHistoryLimit: 3
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devspaces-portal-sharing-scope
  namespace: devspaces-system
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == 'system:serviceaccount:devspaces-system:workspace-portal'
    name: onlyThePortalSA
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - roles
      - rolebindings
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - DELETE
      resources:
      - networkpolicies
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - DELETE
      resources:
      - persistentvolumes
      - persistentvolumeclaims
  validations:
  - expression: variables.name.startsWith('share-') || variables.name.startsWith('workspace-guest-')
      || variables.name.startsWith('peer-') || variables.name.startsWith('shared-')
    message: the portal may only manage share-*, workspace-guest-*, peer-* and shared-*
      objects
  variables:
  - expression: 'request.operation == ''DELETE'' ? oldObject.metadata.name : object.metadata.name'
    name: name
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devspaces-protect-home-drives
  namespace: devspaces-system
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: devspaces.io/tenant
        operator: Exists
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - DELETE
      resources:
      - persistentvolumeclaims
  validations:
  - expression: '!(has(oldObject.metadata.labels) && ''devspaces.io/drive'' in oldObject.metadata.labels
      && oldObject.metadata.labels[''devspaces.io/drive''] == ''home'') || (has(oldObject.metadata.annotations)
      && ''devspaces.io/allow-delete'' in oldObject.metadata.annotations && oldObject.metadata.annotations[''devspaces.io/allow-delete'']
      == ''true'')'
    message: 'this is a home drive (devspaces.io/drive=home); it survives workspace
      deletion on purpose. To really delete it: workspace delete NAME --purge, or
      annotate devspaces.io/allow-delete=true first'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devspaces-protect-tenant-policies
  namespace: devspaces-system
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: devspaces.io/tenant
        operator: Exists
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - DELETE
      - UPDATE
      resources:
      - networkpolicies
  validations:
  - expression: '!(oldObject.metadata.name in [''tenant-ingress'', ''tenant-egress''])
      || request.userInfo.groups.exists(g, g in [''system:masters'', ''devspaces:platform-admins'',
      ''system:serviceaccounts:argocd'', ''system:serviceaccounts:flux-system''])'
    message: the tenant-ingress/tenant-egress policies are managed by the platform
      (group devspaces:platform-admins)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devspaces-workspace-guardrails
  namespace: devspaces-system
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: devspaces.io/tenant
        operator: Exists
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '!(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID)
      && object.spec.hostPID) && !(has(object.spec.hostIPC) && object.spec.hostIPC)'
    message: workspaces may not use hostNetwork, hostPID or hostIPC (use a device
      plugin or SR-IOV instead)
  - expression: variables.isLab || (has(object.spec.hostUsers) && object.spec.hostUsers
      == false) || (has(object.spec.runtimeClassName) && object.spec.runtimeClassName
      in ['gvisor', 'kata'])
    message: standard-tier workspaces must set hostUsers=false or run under the gvisor/kata
      RuntimeClass
  - expression: variables.isLab || !variables.allContainers.exists(c, has(c.securityContext)
      && has(c.securityContext.privileged) && c.securityContext.privileged)
    message: privileged containers are only allowed in *-lab namespaces (workspace
      create --profile hardware)
  - expression: variables.hostPaths.all(p, variables.isLab && variables.allowedHostPathPrefixes.exists(a,
      p == a || p.startsWith(a + '/')))
    message: hostPath volumes must be under /dev, /sys, /lib/modules, /usr/src, /lib/firmware
      or /run/udev and only in lab namespaces
  - expression: '!variables.hostPaths.exists(p, p.startsWith(''/var/run'') || p.startsWith(''/run/containerd'')
      || p.startsWith(''/var/lib/kubelet'') || p.startsWith(''/etc/kubernetes''))'
    message: mounting runtime or kubelet state from the host is not allowed
  - expression: '!variables.isLab || (has(object.spec.nodeSelector) && ''devspaces.io/lab''
      in object.spec.nodeSelector)'
    message: lab-tier workspaces must select the lab node pool (nodeSelector devspaces.io/lab=true)
  variables:
  - expression: has(namespaceObject.metadata.labels) && 'devspaces.io/tier' in namespaceObject.metadata.labels
      && namespaceObject.metadata.labels['devspaces.io/tier'] == 'lab'
    name: isLab
  - expression: 'object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers
      : [])'
    name: allContainers
  - expression: 'has(object.spec.volumes) ? object.spec.volumes.filter(v, has(v.hostPath)).map(v,
      v.hostPath.path) : []'
    name: hostPaths
  - expression: '[''/dev'', ''/sys'', ''/lib/modules'', ''/usr/src'', ''/lib/firmware'',
      ''/run/udev'']'
    name: allowedHostPathPrefixes
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devspaces-portal-sharing-scope
  namespace: devspaces-system
spec:
  policyName: devspaces-portal-sharing-scope
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devspaces-protect-home-drives
  namespace: devspaces-system
spec:
  policyName: devspaces-protect-home-drives
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devspaces-protect-tenant-policies
  namespace: devspaces-system
spec:
  policyName: devspaces-protect-tenant-policies
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devspaces-workspace-guardrails
  namespace: devspaces-system
spec:
  policyName: devspaces-workspace-guardrails
  validationActions:
  - Deny
  - Audit
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: mcast
  namespace: devspaces-system
spec:
  config: |
    {
      "cniVersion": "0.4.0",
      "name": "mcast",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eth0",
          "mode": "bridge",
          "mtu": 1500,
          "ipam": {
            "type": "whereabouts",
            "range": "10.250.0.0/16",
            "exclude": ["10.250.0.0/30", "10.250.255.255/32"],
            "routes": [
              { "dst": "224.0.0.0/4" }
            ]
          }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv4.conf.net1.rp_filter": "0",
            "net.ipv4.conf.all.rp_filter": "0",
            "net.ipv4.igmp_max_memberships": "1024",
            "net.ipv4.igmp_max_msf": "64",
            "net.ipv4.conf.net1.force_igmp_version": "0",
            "net.core.rmem_max": "26214400"
          }
        }
      ]
    }
---
apiVersion: node.k8s.io/v1
handler: runsc
kind: RuntimeClass
metadata:
  name: gvisor
overhead:
  podFixed:
    cpu: 100m
    memory: 128Mi
scheduling:
  nodeSelector:
    devspaces.io/runtime-gvisor: "true"
---
apiVersion: node.k8s.io/v1
handler: kata-qemu
kind: RuntimeClass
metadata:
  name: kata
overhead:
  podFixed:
    cpu: 250m
    memory: 350Mi
scheduling:
  nodeSelector:
    devspaces.io/lab: "true"
  tolerations:
  - effect: NoSchedule
    key: devspaces.io/lab
    operator: Equal
    value: "true"
