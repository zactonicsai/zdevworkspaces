  catalog.json: |
    {
      "$comment": "Source of truth for what developers may build, shared by the CLI and the web portal. kustomize publishes it as ConfigMap devspaces-system/workspace-catalog. Admins add a language or tool here (plus images/features/<name>/install.sh, or just an `artifact` block for something downloadable from Artifactory) \u2014 no CLI/portal release needed.",
      "registry": "artifactory.example.com/devspaces-docker",
      "tag": "2026.10",
      "pullSecret": "artifactory-pull",
      "artifactory": {
        "$comment": "Everything a workspace downloads comes from here. `url` is the Artifactory base (\u2026/artifactory). Repos are names of remote/virtual repositories you create; leave one empty to skip configuring that package manager. The portal lists images and tool versions through the Artifactory REST API; workspaces pull packages through these repos (configure-artifactory at boot).",
        "url": "https://artifactory.example.com/artifactory",
        "repos": {
          "docker": "devspaces-docker",
          "generic": "devspaces-generic",
          "github": "github-remote",
          "apt": "ubuntu-remote",
          "pypi": "pypi-remote",
          "npm": "npm-remote",
          "go": "go-remote",
          "maven": "maven-remote",
          "cargo": "cargo-remote"
        },
        "docs": "https://jfrog.com/help/r/jfrog-artifactory-documentation"
      },
      "defaults": {
        "profile": "standard",
        "isolation": "userns",
        "cpu": "4",
        "memory": "8Gi",
        "cpuRequest": "1",
        "memoryRequest": "2Gi",
        "ephemeralStorage": "20Gi",
        "size": "30Gi",
        "storageClass": "",
        "idleTimeout": "4h"
      },
      "languages": {
        "base": {
          "image": "workspace-base",
          "label": "No language (bare Linux)",
          "description": "Ubuntu 24.04 with compilers, git and ssh \u2014 add languages as tools",
          "docs": "https://ubuntu.com/server/docs"
        },
        "python": {
          "image": "workspace-python",
          "label": "Python",
          "description": "Python 3 with pip, venv, pipx and uv",
          "docs": "https://docs.python.org/3/",
          "learn": "https://docs.python.org/3/tutorial/"
        },
        "go": {
